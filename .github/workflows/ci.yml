name: AI-CICD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: docker build -t ai-assistant .

      - name: Tag Docker Image
        run: |
          docker tag ai-assistant:latest 381491924963.dkr.ecr.ap-south-1.amazonaws.com/ai-assistant:latest

      - name: Push Docker Image
        run: |
          docker push 381491924963.dkr.ecr.ap-south-1.amazonaws.com/ai-assistant:latest