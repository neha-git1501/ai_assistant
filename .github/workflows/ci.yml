name: AI-CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Verify Docker
        run: docker --version

      - name: Verify Python
        run: python --version

      - name: Build Docker Image
        run: docker build -t ai-assistant .

      - name: Verify Image Creation
        run: docker images